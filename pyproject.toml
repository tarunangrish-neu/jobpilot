[project]
name = "jobpilot"
version = "0.1.0"
description = "Local AI job application pipeline: source, filter, score, tailor, prefill, review."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "typer>=0.12",
    "pyyaml>=6.0",
    "playwright>=1.47",
    "streamlit>=1.38",
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobpilot = "jobpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

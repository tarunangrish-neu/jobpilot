# JobPilot configuration. Personal answers live in config/answers.yaml (gitignored).

http:
  user_agent: "JobPilot/0.1 (personal job search tool)"
  min_seconds_between_requests_per_host: 1.0
  concurrency: 8
  timeout_seconds: 30
  cache_ttl_hours: 6

llm:
  provider: ollama            # ollama | openai_compatible
  text_model: "qwen2.5:7b-instruct"
  embed_model: "nomic-embed-text"
  timeout_seconds: 120        # model time only; waiting for a free slot doesn't count
  max_retries: 4
  log_path: "logs/llm.jsonl"
  # Model calls in flight at once, across ALL jobpilot processes. Local Ollama runs
  # ~1 generation at a time, so more just queues. Raise to 4-8 for a hosted provider.
  concurrency: 1
  keep_alive: "30m"           # keep models loaded between stages (reload costs seconds)
  num_ctx: 8192               # context window; 4096 truncates resume + JD + tailoring plan
  # Optional faster model per task, e.g. after `ollama pull qwen2.5:3b-instruct`:
  #   task_models: {visa_check: "qwen2.5:3b-instruct", hn_extract: "qwen2.5:3b-instruct"}
  task_models: {}

filters:
  max_posting_age_days: 30
  locations_allow:
    - united states
    - usa
    - us
    - remote - us
    - new york
    - new jersey
    - san francisco
    - seattle
    - austin
    - boston
    - chicago
    - washington
    - washington d.c.
    - d.c.
    - virginia
    - maryland
    - delaware
    - pennsylvania
    - new hampshire
    - vermont
    - massachusetts
    - rhode island
    - connecticut
    - new york city
    - brooklyn
    - queens
    - bronx
    - manhattan
    - staten island
    - long island
  # Keep false: boards mark roles "Remote - Japan" / "Remote - EU" as remote, and
  # those are unusable on F-1 STEM OPT. Location must still clear locations_allow.
  allow_remote_anywhere: false
  title_include:
    - backend
    - back end
    - infrastructure
    - manager
    - fullstack
    - platform
    - founding engineer
    - distributed systems
    - payments
    - systems engineer
    - software engineer
    - ai infrastructure
    - ml infrastructure
  title_exclude:
    - intern
    - internship
    - principal
    - staff
    - director
    - frontend
    - front end
    - designer
    - sales
    - recruiter

visa:
  # Regex-free literal phrases; matched case-insensitively against the description.
  blocking_phrases:
    - "no sponsorship"
    - "not provide sponsorship"
    - "will not sponsor"
    - "unable to sponsor"
    - "do not sponsor"
    - "cannot sponsor"
    - "without sponsorship"
    - "us citizens only"
    - "u.s. citizens only"
    - "must be a us citizen"
    - "must be a u.s. citizen"
    - "citizen or green card holder"
    - "security clearance required"
    - "active security clearance"
    - "ts/sci"
    - "itar"
  llm_check_ambiguous: true

scoring:
  embed_top_n: 60
  weights:
    embed: 0.3
    llm: 0.7
  lca_boost: 5.0             # added to final score when the company has LCA history

hn:
  # HN "Who is hiring?" (latest monthly thread). Every kept comment costs one LLM call
  # the first time (cached after), so it is opt-in. HN jobs are applied to manually.
  enabled: true
  max_comments: 80
  keywords: [backend, infrastructure, platform, rust, payments, distributed, founding engineer, ml infra, ai infra]

discovery:
  # Find new company boards with web-search queries; verified boards are appended to
  # companies.yaml, then fetched from their official ATS APIs. Uses a search API (Google's
  # result pages are never scraped). Free tiers: brave (BRAVE_API_KEY, ~2k queries/mo),
  # google_cse (GOOGLE_CSE_KEY + GOOGLE_CSE_CX, ~100/day), serpapi (SERPAPI_API_KEY, ~100/mo;
  # serpapi_engine: google_jobs searches Google Jobs listings). Keys go in .env.
  enabled: false              # true = run the queries at the start of every `fetch`
  provider: brave             # brave | google_cse | serpapi
  serpapi_engine: google      # google | google_jobs (serpapi only)
  max_results_per_query: 40
  min_open_roles: 1
  queries:
    - 'site:jobs.ashbyhq.com "backend engineer" (payments OR stablecoin OR fintech)'
    - 'site:boards.greenhouse.io "software engineer" (infrastructure OR platform) "New York"'
    - 'site:jobs.lever.co "backend" (crypto OR blockchain OR payments)'
    - 'site:jobs.ashbyhq.com ("ML infrastructure" OR "AI infrastructure" OR "inference")'
    - 'site:job-boards.greenhouse.io "distributed systems" engineer remote US'

large_boards:
  # Workday / Amazon / Eightfold / Oracle career sites list thousands of roles, so they are
  # searched by keyword instead of paged in full. Each term is one search per company.
  search_terms: ["software engineer", "backend engineer", "platform engineer", "infrastructure engineer", "distributed systems"]
  max_per_term: 200      # listings read per term per company
  max_details: 150       # description fetches per company (after title/location rules)

tailor:
  max_bullets: 12              # upper bound; bullets are trimmed further until the PDF is one page
  # auto: write a cover letter only when the application form has a cover-letter field
  # (generated during prefill). always / never override that.
  cover_letter: auto
  cover_letter_max_words: 200

apply:
  daily_submission_cap: 100
  answer_match_threshold: 0.85   # cosine similarity for mapping a form question to the answer bank
  headless: true
